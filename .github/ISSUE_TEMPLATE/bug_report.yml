name: Bug report
description: Report a reproducible bug in VieForge core, CLI, MCP server, or IDE installer
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Command executed (e.g., `vieforge setup` or `vieforge mcp --check`)
        2. Expected behavior
        3. Actual behavior / trimmed traceback
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `vieforge doctor --json`
      render: json
    validations:
      required: false
