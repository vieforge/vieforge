name: VieForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Commercial License Clean-Room Audit
        run: python -m core.license_audit

      - name: Run Unit Test Suite (pytest)
        run: pytest -v

      - name: Run Pre-Flight & Step Auditor
        run: |
          python scripts/preflight_check.py --json
          python scripts/audit_step.py --step ci_matrix
