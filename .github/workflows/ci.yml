name: VieForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies & build backend
        run: python -m pip install --upgrade pip && pip install hatchling && pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Commercial License Clean-Room Audit
        run: python -m core.license_audit

      - name: Run Unit Test Suite (pytest)
        run: pytest -v

      - name: Run 2-Axis Cross-OS Verification (Core Gate + Clean Wheel E2E + OS Lock)
        run: python scripts/verify_cross_os.py run --step "ci_${{ matrix.os }}_py${{ matrix.python-version }}" --os-label "${{ matrix.os }}-py${{ matrix.python-version }}" --out "data/os_report_${{ matrix.os }}_py${{ matrix.python-version }}.json"

      - name: Upload OS Verification Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: data/os_report_${{ matrix.os }}_py${{ matrix.python-version }}.json

  cross-os-parity-gate:
    needs: test-and-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download All 3-OS Verification Reports
        uses: actions/download-artifact@v4
        with:
          path: ci_reports
          pattern: os-report-*
          merge-multiple: true

      - name: Cross-Verify 3-OS Behavioral Parity & Publish Scorecard
        run: |
          python scripts/verify_cross_os.py compare ci_reports/os_report_*.json \
            --markdown-out ci_reports/parity_scorecard.md
          cat ci_reports/parity_scorecard.md >> "$GITHUB_STEP_SUMMARY"
