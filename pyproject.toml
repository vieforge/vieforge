[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "vieforge"
version = "0.4.2"
description = "VieForge — Code First, Local LLM Second, Cloud Last. 3-Tier Hybrid AI Agent Harness for checkpointed, budget-guarded local execution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "VieForge Contributors" },
]
keywords = [
  "ai-agents",
  "mcp",
  "ollama",
  "local-llm",
  "agent-harness",
  "cost-control",
  "checkpointing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Core engine intentionally relies on Python stdlib for maximum portability
# and 100% clean-room commercial-safe licensing.
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=1.2.0",
]
dev = [
  "hatchling>=1.25.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
vieforge = "scripts.cli:main"
vieforge-setup = "scripts.quick_setup:main"
vieforge-preflight = "scripts.preflight_check:main"
vieforge-bench = "scripts.benchmark_token_savings:main"
vieforge-mcp = "scripts.mcp_server:main"
vieforge-audit = "scripts.audit_step:main"

[project.urls]
Homepage = "https://vieforge.dev"
Repository = "https://github.com/vieforge/vieforge"
Issues = "https://github.com/vieforge/vieforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["core", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "core/_bundled_assets/config"
"skills" = "core/_bundled_assets/skills"
"AGENTS.md" = "core/_bundled_assets/AGENTS.md"
"examples/01_batch_doc_processor/run_demo.py" = "core/_bundled_assets/examples/01_batch_doc_processor/run_demo.py"
"examples/03_ci_log_triage/run_ci_triage.py" = "core/_bundled_assets/examples/03_ci_log_triage/run_ci_triage.py"
"extensions/tierforge-bridge" = "core/_bundled_assets/extensions/tierforge-bridge"
"plugins/vieforge-lens" = "core/_bundled_assets/plugins/vieforge-lens"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E402", "E501", "UP045", "UP035"]
